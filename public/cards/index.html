<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cascading Castles · Cards</title><style>
*{box-sizing:border-box}body{margin:0;background:#142e24;color:#e9dbb8;font-family:Georgia,serif}header{display:flex;justify-content:space-between;align-items:center;padding:25px 4%;border-bottom:1px solid #b39b6555}h1{font-weight:400;margin:0 0 8px}p{font:12px Arial;color:#b9c3a7}a{color:#e4c990}main{padding:25px 4%;display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:22px}button{cursor:pointer;background:none;border:0;padding:0;color:inherit}main img{width:100%;display:block;border-radius:9px;box-shadow:0 4px 15px #0006}main button:hover{transform:translateY(-4px)}button:focus-visible,a:focus-visible{outline:2px solid #efd599;outline-offset:4px}dialog{padding:0;background:#173326;border:1px solid #c9ad74;border-radius:12px;max-height:95dvh;max-width:95vw;overflow:hidden}dialog::backdrop{background:#081e16ce}dialog img{display:block;max-height:88dvh;max-width:90vw}dialog button{position:absolute;right:10px;top:10px;background:#173326;border:1px solid #cbb17a;border-radius:50%;font-size:24px;width:35px;height:35px}
</style></head><body><header><div><h1>The card collection</h1><p>23 movement faces · 90-card deck · 8 spells · raven reverse</p></div><a href="../">Back to the game ↗</a></header><main></main><dialog><button aria-label="Close card">×</button><img alt=""></dialog><script>
const spells={stride:'Fleetfoot',lift:'Walking Stone',headwind:'Wayward Wind',undertow:'Stone Tide',swap:'Twinned Turrets',nudge:'Call the Keep',rescue:'Unbar the Door',piggyback:'Fellowship'};
const entries=[...Array.from({length:23},(_,i)=>[i+1,`Movement face ${i+1}`]),...Object.entries(spells),['back','Raven card back']];
const dialog=document.querySelector('dialog'),large=dialog.querySelector('img');
for(const [id,name]of entries){const b=document.createElement('button'),i=document.createElement('img');i.src=`../art/cards/revision-05/faces/${id}.png`;i.alt=name;i.loading='lazy';b.append(i);b.addEventListener('click',()=>{large.src=i.src;large.alt=name;dialog.showModal()});document.querySelector('main').append(b)}
dialog.querySelector('button').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
</script></body></html>
